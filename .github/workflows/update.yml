name: Actualizare OPCOM

on:
  schedule:
    - cron: '15 12 * * *' # Zilnic la 14:15 ora României
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python fetch_pzu_15m.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git commit -m "Update OPCOM" || exit 0
          git push
